
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service-v2
  namespace: microservices
  labels:
    app: employee-service
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-service
      version: v2
  template:
    metadata:
      labels:
        app: employee-service
        version: v2
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
